name: digioffice

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digioffice-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: digioffice-minio
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
      - ./minio.license:/minio.license:ro

  # LibreOffice untuk mengubah naskah .docx menjadi PDF resmi. Port 3001 di host, karena 3000
  # dipakai front-end. Tanpa data permanen (PDF hasilnya disimpan back-end di MinIO).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: digioffice-gotenberg
    command: gotenberg --api-timeout=60s
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  sqlserver-data:
  minio-data: